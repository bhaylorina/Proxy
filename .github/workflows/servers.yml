name: Fetch India VPN Servers

on:
  workflow_dispatch: # Sirf manual run ke liye

permissions:
  contents: write

jobs:
  update-server-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run India Server Fetcher
        run: python proxy.py

      - name: Commit and Push New Servers
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          touch server_list.txt
          mkdir -p ovpn_configs
          git add server_list.txt ovpn_configs/
          git diff --staged --quiet || git commit -m "Update India server list"
          git push
